name: Reproduce book recommendation results
on:
  push:
    branches: [main]
    paths:
      - 'notebooks/**'
      - 'academic/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/reproduce-book-results.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute academic and research notebooks
        run: |
          python - <<'PY'
          import pathlib,nbformat
          from nbclient import NotebookClient
          root=pathlib.Path.cwd()
          for name in ['academic/Project_2_Course_Submission.ipynb','notebooks/Project_2_Book_Recommendation_Engine.ipynb']:
              target=root/name
              notebook=nbformat.read(target,as_version=4)
              NotebookClient(notebook,kernel_name='python3',timeout=900,
                             resources={'metadata':{'path':str(root)}},allow_errors=False).execute()
              assert all(c.execution_count is not None for c in notebook.cells if c.cell_type=='code')
              assert not any(o.output_type=='error' for c in notebook.cells for o in c.get('outputs',[]))
              nbformat.write(notebook,target)
              print('PASS:',name,flush=True)
          PY
      - name: Verify all calculated assets and scientific integrity
        run: python tests/verify_repository.py
      - name: Save verified outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add academic/Project_2_Course_Submission.ipynb notebooks/Project_2_Book_Recommendation_Engine.ipynb data/results.json data/results.js assets/top-books.png assets/top-authors.png assets/model-comparison.png assets/top-books.svg assets/top-authors.svg assets/model-comparison.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Record validated Project 2 results'
            git push
          fi
