name: Reproduce book recommendation results
on:
  push:
    branches: [main]
    paths:
      - 'notebooks/**'
      - 'academic/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/reproduce-book-results.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install notebook validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Simulate a clean Colab runtime without ftfy
        run: |
          python -m pip uninstall -y ftfy
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('ftfy') is None
          print('PASS: testing the notebook without ftfy preinstalled')
          PY
      - name: Execute both notebooks in fresh and local environments
        run: |
          python - <<'PY'
          import json, pathlib, tempfile, shutil
          import nbformat
          from nbclient import NotebookClient
          root=pathlib.Path.cwd()
          prior=json.loads((root/'data/results.json').read_text(encoding='utf-8'))
          academic=root/'academic/Project_2_Course_Submission.ipynb'
          research=root/'notebooks/Project_2_Book_Recommendation_Engine.ipynb'
          with tempfile.TemporaryDirectory(prefix='colab-fresh-') as folder:
              cwd=pathlib.Path(folder)
              notebook=nbformat.read(academic,as_version=4)
              NotebookClient(notebook,kernel_name='python3',timeout=1200,
                             resources={'metadata':{'path':str(cwd)}},allow_errors=False).execute()
              assert all(c.execution_count is not None for c in notebook.cells if c.cell_type=='code')
              assert not any(o.output_type=='error' for c in notebook.cells for o in c.get('outputs',[]))
              print('PASS: Colab-style academic notebook with automatic dependency setup',flush=True)
              for csv in ('Books.csv','Ratings.csv','Users.csv'):
                  source=cwd/'data'/csv
                  assert source.stat().st_size>1000, csv
                  shutil.copyfile(source,root/'data'/csv)
          notebook=nbformat.read(research,as_version=4)
          NotebookClient(notebook,kernel_name='python3',timeout=1200,
                         resources={'metadata':{'path':str(root)}},allow_errors=False).execute()
          assert all(c.execution_count is not None for c in notebook.cells if c.cell_type=='code')
          assert not any(o.output_type=='error' for c in notebook.cells for o in c.get('outputs',[]))
          current=json.loads((root/'data/results.json').read_text(encoding='utf-8'))
          assert current==prior, 'Metrics or website results drifted from the checked-in validated version.'
          print('PASS: research notebook and published metrics are reproducible',flush=True)
          PY
      - name: Verify content, scientific metrics and page data
        run: python tests/verify_repository.py
